[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slopgate"
version = "0.1.0"
description = "A local, CPU-only, confidence-gated front door for open-source maintainers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SlopGate Contributors" }
]
keywords = ["open-source", "triage", "strands-decider", "bedrock", "confidence-gating"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch",
    "strands-decider",
    "boto3",
    "python-dotenv",
    "pyyaml",
    "pydantic>=2.0",
    "httpx",
    "scikit-learn",
    "rank-bm25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.scripts]
slopgate = "slopgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q -m \"not slow and not live\""
markers = [
    "slow: marks tests as slow, running real decider model inference",
    "live: marks tests calling real AWS Bedrock API",
]
